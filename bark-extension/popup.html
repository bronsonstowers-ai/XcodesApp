<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bark Visible Extractor</title>
    <style>
      body { font-family: Arial, sans-serif; width: 380px; padding: 12px; }
      pre { white-space: pre-wrap; word-break: break-word; max-height: 75vh; overflow:auto; }
      .muted { color: #666; font-size: 12px; margin-bottom: 10px; }
      .field { margin: 8px 0; }
      .label { font-size: 12px; color: #666; }
      .value { font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="muted">Reads only what’s visible to your account on the page.</div>
    <div class="field"><div class="label">Name</div><div id="name" class="value">—</div></div>
    <div class="field"><div class="label">Email</div><div id="email" class="value">—</div></div>
    <div class="field"><div class="label">Phone</div><div id="phone" class="value">—</div></div>
    <div class="field"><div class="label">URL</div><pre id="url" style="margin:0; font-size:12px;">—</pre></div>
    <script src="popup.js"></script>
  </body>
</html>
